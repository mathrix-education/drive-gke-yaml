apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: cdn.mathrixdrive.fr-certificate
  namespace: default
spec:
  secretName: cdn.mathrixdrive.fr-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: cdn.mathrixdrive.fr
  dnsNames:
  - cdn.mathrixdrive.fr
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - cdn.mathrixdrive.fr
