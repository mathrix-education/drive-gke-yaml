apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: drive.mathrix.fr-certificate
  namespace: default
spec:
  secretName: drive.mathrix.fr-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: drive.mathrix.fr
  dnsNames:
  - drive.mathrix.fr
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - drive.mathrix.fr
