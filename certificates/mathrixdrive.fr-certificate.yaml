apiVersion: certmanager.k8s.io/v1alpha1
kind: Certificate
metadata:
  name: mathrixdrive.fr-certificate
  namespace: default
spec:
  secretName: mathrixdrive.fr-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: mathrixdrive.fr
  dnsNames:
  - mathrixdrive.fr
  acme:
    config:
    - dns01:
        provider: clouddns
      domains:
      - mathrixdrive.fr
