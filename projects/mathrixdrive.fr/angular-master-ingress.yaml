apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  labels:
    app: drive-angular
    environment: master
    tier: backend
  name: master-drive-angular-ingress
  namespace: default
spec:
  rules:
  - host: mathrixdrive.fr
    http:
      paths:
      - backend:
          serviceName: master-drive-angular-service
          servicePort: 8081
        path: /
  tls:
  - hosts:
    - mathrixdrive.fr
    secretName: mathrixdrive.fr-secret
---
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/permanent-redirect: http://bit.ly/2VBYvNp
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  labels:
    app: drive-api
    environment: master
    tier: backend
  name: email-ingress
  namespace: default
spec:
  rules:
  - host: email.mathrixdrive.fr
    http:
      paths:
      - backend:
          serviceName: master-drive-angular-service
          servicePort: 80
        path: /?(.*)
  tls:
  - hosts:
    - email.mathrixdrive.fr
    secretName: email.mathrixdrive.fr-secret

