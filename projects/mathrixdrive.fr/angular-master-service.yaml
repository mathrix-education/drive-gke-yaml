apiVersion: v1
kind: Service
metadata:
  labels:
    app: drive-angular
    environment: master
    tier: frontend
  name: master-drive-angular-service
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - port: 8081
    protocol: TCP
    targetPort: 8081
