apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: drive-angular
    environment: master
    tier: frontend
  name: master-drive-angular-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 8
  selector:
    matchLabels:
      app: drive-angular
      environment: master
      tier: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: drive-angular
        environment: master
        tier: frontend
    spec:
      containers:
      - name: angular
        image: eu.gcr.io/mathrix-education/drive-angular:latest-master
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 10m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10

