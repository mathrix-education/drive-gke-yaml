apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers Server;
    nginx.org/server-snippets: gzip on; gzip_proxied any; gzip_types image/jpeg;
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: https-auth
    nginx.ingress.kubernetes.io/auth-realm: "Bienvenue sur le site de développement de Mathrix Drive."
  labels:
    app: drive-angular
    environment: dev
    tier: backend
  name: dev-drive-angular-ingress
  namespace: default
spec:
  rules:
  - host: dev.mathrixdrive.fr
    http:
      paths:
      - backend:
          serviceName: dev-drive-angular-service
          servicePort: 8081
        path: /
  tls:
  - hosts:
    - dev.mathrixdrive.fr
    secretName: dev.mathrixdrive.fr-secret


