apiVersion: v1
kind: Service
metadata:
  labels:
    app: drive-api
    environment: dev
    tier: backend
  name: dev-drive-api-service
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - nodePort: 30843
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: drive-api
    environment: dev
    tier: backend
  sessionAffinity: None
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: drive-cdn
    environment: dev
    tier: backend
  name: dev-drive-cdn-service
spec:
  externalName: storage.googleapis.com
  type: ExternalName

