apiVersion: extensions/v1beta1
kind: Deployment
metadata:
  labels:
    app: drive-api
    environment: dev
    tier: backend
    type: server
  name: dev-drive-api-server-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 2
  selector:
    matchLabels:
      app: drive-api
      environment: dev
      tier: backend
      type: server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: drive-api
        environment: dev
        tier: backend
        type: server
    spec:
      containers:
      - name: server
        image: eu.gcr.io/mathrix-education/drive-api:latest-dev
        imagePullPolicy: Always
        args: [server]
        envFrom:
        - configMapRef: 
            name: dev-api-env-configmap
        - secretRef:
            name: dev-api-env-secret
        resources:
          requests:
            cpu: 20m
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - name: dev-cdn-keychain
          mountPath: /var/www/storage/keychain
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 10
      volumes:
        - name: dev-cdn-keychain
          secret:
            secretName: dev-drive-keychain
