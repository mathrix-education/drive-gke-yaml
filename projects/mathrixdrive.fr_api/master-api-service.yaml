apiVersion: v1
kind: Service
metadata:
  labels:
    app: drive-api
    environment: master
    tier: backend
    type: server
  name: master-drive-api-service
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: drive-api
    environment: master
    tier: backend
    type: server
  sessionAffinity: None
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: drive-cdn
    environment: master
    tier: backend
    type: server
  name: master-drive-cdn-service
spec:
  externalName: storage.googleapis.com
  type: ExternalName
